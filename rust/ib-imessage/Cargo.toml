[package]
name = "ib-imessage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "iMessage transport helper for iphonebridge, over a line-delimited JSON unix socket"

[dependencies]
# remote-anisette-v3 is not optional on Linux: icloud_auth unconditionally
# re-exports omnisette::default_provider, which is gated behind that feature
# on every non-macOS target, so the workspace doesn't link without it.
rustpush = { path = "../rustpush", features = ["remote-anisette-v3"] }

# Same keystore instance rustpush resolves private keys through; we have to
# install it and import the migrated keys ourselves. See src/migrate.rs.
keystore = { path = "../rustpush/keystore" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"
log = "0.4"
pretty_env_logger = "0.5"
anyhow = "1"
# Square-crop and re-encode the set_profile photo. JPEG/PNG only, to keep the
# dependency small.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[bin]]
name = "ib-imessage"
path = "src/main.rs"

[profile.release]
# The helper is long-lived and mostly idle; favour a small binary and fast
# builds over aggressive optimisation we'd never notice.
opt-level = 2
lto = "thin"

# [patch] only applies at the workspace root, so rustpush's own quinn patch is
# ignored when this crate is the root; without it h3-quinn and rustpush see two
# different `quinn::Connection` types.
[patch.crates-io]
quinn = { path = "../rustpush/third_party/quinn/quinn" }
